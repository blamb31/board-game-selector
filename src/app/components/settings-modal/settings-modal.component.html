<div class="modal-backdrop" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <header>
            <h2>Settings</h2>
            <button class="close-btn" (click)="closeModal()">&times;</button>
        </header>

        <div class="form-container">
            <div class="form-group">
                <label for="username">BGG Username:</label>
                <input type="text" id="username" [(ngModel)]="username" placeholder="BGG username">
            </div>

            <div class="form-group">
                <label for="password">BGG Password:</label>
                <input type="password" id="password" [(ngModel)]="password" placeholder="Required for logging plays">
                <small class="helper-text" style="color: #e67e22; font-size: 0.8rem; margin-top: 4px;">Sent securely through API proxy to log plays directly on BGG.</small>
            </div>

            <button class="btn-primary" (click)="saveSettings()">Save Settings</button>
        </div>
    </div>
</div>
